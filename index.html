<style>
/* ============================================================
   VIBE × 연애 성향 테스트 — 감성 스티커 다이어리
   웜화이트 줄노트 + 손글씨(Dongle) + 더스티핑크/세이지 + 스티커칩
   ============================================================ */

:root {
  --paper: #fbf6ec;
  --ink: #4a4038;
  --sub: #9b8e80;
  --pink: #cf8597;
  --pink-dk: #b06b7e;
  --sage: #88997a;
  --line: rgba(207, 133, 151, 0.20);
  --hand: "Dongle", sans-serif;
  --body: "Gowun Dodum", sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  background: #efe7d8;
  color: var(--ink);
  font-family: var(--body);
  -webkit-font-smoothing: antialiased;
  min-height: 100%;
}
body { display: flex; justify-content: center; }
#root { width: 100%; max-width: 480px; }

.s-app {
  position: relative;
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  background-color: var(--paper);
  background-image: linear-gradient(transparent 31px, var(--line) 31px, var(--line) 32px, transparent 32px);
  background-size: 100% 32px;
  box-shadow: 0 0 60px rgba(0,0,0,0.15);
  overflow: hidden;
}
.s-app::before {
  content: "";
  position: absolute;
  top: 0; bottom: 0; left: 38px;
  width: 2px;
  background: rgba(207,133,151,0.45);
  z-index: 0;
}

.s-screen { position: relative; z-index: 1; padding: 30px 24px 36px; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }

/* 손글씨 데코 */
.s-date { font-family: var(--hand); font-size: 19px; color: var(--sub); letter-spacing: 0.02em; line-height: 1; white-space: nowrap; }
.s-hand-h { font-family: var(--hand); font-size: 32px; color: var(--ink); line-height: 1; }

/* 스티커 칩 */
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-weight: 700; font-size: 14px; white-space: nowrap;
  padding: 9px 15px; background: #fff; color: var(--ink);
  border-radius: 100px; border: 1.5px solid rgba(0,0,0,0.05);
  box-shadow: 0 2px 0 rgba(0,0,0,0.06), 0 5px 12px -5px rgba(0,0,0,0.3);
}
.chip.pink { background: var(--pink); color: #fff; border-color: transparent; }
.chip.sage { background: var(--sage); color: #fff; border-color: transparent; }
.chip.sm { font-size: 12.5px; padding: 6px 12px; }

/* 버튼 */
.s-btn {
  display: block; width: 100%; cursor: pointer;
  font-family: var(--hand); font-size: 24px; line-height: 1.1;
  color: #fff; background: var(--pink); border: none;
  border-radius: 16px; padding: 13px;
  box-shadow: 3px 3px 0 var(--pink-dk);
  transition: transform 0.1s, box-shadow 0.1s, opacity 0.2s;
  white-space: nowrap;
}
.s-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--pink-dk); }
.s-btn:disabled { opacity: 0.55; box-shadow: 3px 3px 0 rgba(0,0,0,0.12); cursor: default; }
.s-btn.ghost {
  background: transparent; color: var(--ink);
  border: 2px dashed var(--sub); box-shadow: none;
  font-size: 21px; padding: 11px;
}
.s-btn.ghost:active { transform: none; background: rgba(0,0,0,0.03); }

/* ---------------- 인트로 ---------------- */
.s-intro { justify-content: center; align-items: center; text-align: center; gap: 0; }
.s-intro .s-title {
  font-family: var(--hand); font-weight: 700; font-size: 38px;
  line-height: 1.22; color: var(--ink); margin: 6px 0 12px;
}
.s-title .tl { display: block; white-space: nowrap; }
.s-intro .s-title b { color: var(--pink); font-weight: 700; }
.s-sub { font-size: 14.5px; color: var(--sub); line-height: 1.75; }

.note {
  width: 100%;
  background: rgba(255,255,255,0.7);
  border: 1.5px solid rgba(0,0,0,0.06);
  border-radius: 6px;
  padding: 18px;
  box-shadow: 2px 3px 10px -4px rgba(0,0,0,0.2);
}
.s-meta { display: flex; justify-content: space-around; text-align: center; margin: 22px 0; }
.s-meta .m-num { font-family: var(--hand); font-size: 30px; color: var(--pink); line-height: 0.9; white-space: nowrap; }
.s-meta .m-label { font-size: 11.5px; color: var(--sub); }

.s-chips { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-bottom: 30px; }
.s-chips .chip { justify-content: flex-start; font-size: 14px; padding: 13px 16px; }

.s-foot { font-family: var(--hand); font-size: 20px; color: var(--sub); margin-top: 14px; }
.s-intro .s-btn, .s-intro .s-chips, .s-intro .note { width: 100%; }
.intro-stack { width: 100%; }

/* ---------------- 퀴즈 ---------------- */
.topbar { display: flex; align-items: center; gap: 12px; padding-bottom: 6px; }
.back {
  flex-shrink: 0; width: 38px; height: 38px; border-radius: 50%;
  border: 2px dashed var(--sub); background: transparent; color: var(--sub);
  font-size: 22px; line-height: 1; cursor: pointer; padding-bottom: 3px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--body);
}
.back:disabled { opacity: 0.3; }
.dots { flex: 1; display: flex; gap: 3px; }
.dots .d { flex: 1; height: 7px; border-radius: 4px; background: rgba(0,0,0,0.09); }
.dots .d.on { background: var(--pink); }
.counter { flex-shrink: 0; font-family: var(--hand); font-size: 30px; color: var(--ink); min-width: 56px; text-align: right; line-height: 1; }
.counter .tot { color: var(--sub); }

.quiz-body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 26px; }
.q-note { min-height: 188px; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
.q-index { font-family: var(--hand); font-size: 26px; color: var(--pink); line-height: 1; }
.q-text { font-size: 23px; font-weight: 700; line-height: 1.5; color: var(--ink); letter-spacing: -0.01em; text-wrap: pretty; }

@media (prefers-reduced-motion: no-preference) {
  .q-note { animation: noteIn 0.4s cubic-bezier(0.2,0.8,0.2,1); }
}
@keyframes noteIn { from { transform: translateY(14px) rotate(-0.6deg); } to { transform: none; } }

/* 손그림 척도 */
.ticks { display: flex; align-items: center; justify-content: space-between; padding: 0 2px; }
.tick {
  border: 2.5px solid var(--sub); border-radius: 50%;
  background: transparent; cursor: pointer; position: relative; flex-shrink: 0;
  transition: transform 0.12s, background 0.15s, border-color 0.15s;
}
.tick:active { transform: scale(0.9); }
.tick.sel { background: var(--pink); border-color: var(--pink); box-shadow: 0 4px 10px -3px rgba(176,107,126,0.6); }
.tick.sel::after {
  content: "✓"; position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 19px; font-weight: 700; font-family: var(--body);
}
.ends { display: flex; justify-content: space-between; font-family: var(--hand); font-size: 18px; color: var(--sub); margin-top: 8px; }
.ends span { white-space: nowrap; }

/* ---------------- 결과 ---------------- */
.s-result { display: block; padding-top: 30px; }
.r-hero { text-align: center; position: relative; padding: 8px 0 22px; }
.stamp {
  position: absolute; top: 0; right: 4px;
  width: 78px; height: 78px; border: 2.5px solid var(--pink); border-radius: 50%;
  color: var(--pink); display: flex; align-items: center; justify-content: center;
  text-align: center; font-family: var(--hand); font-size: 21px; line-height: 0.95;
  transform: rotate(-12deg); opacity: 0.66; mix-blend-mode: multiply;
}
.stamp::before { content: ""; position: absolute; inset: 5px; border: 1.5px solid var(--pink); border-radius: 50%; }
.hero-emoji { font-size: 66px; line-height: 1; }
@media (prefers-reduced-motion: no-preference) { .hero-emoji { animation: pop 0.6s cubic-bezier(0.2,1.4,0.4,1); } }
@keyframes pop { from { transform: scale(0.55); } to { transform: scale(1); } }
.hero-kicker { font-family: var(--hand); font-size: 24px; color: var(--sub); line-height: 1; }
.hero-name { font-family: var(--hand); font-weight: 700; font-size: 62px; color: var(--pink); line-height: 1.02; margin: 2px 0 8px; }
.hero-line { font-size: 14.5px; color: var(--sub); line-height: 1.55; margin-bottom: 14px; text-wrap: pretty; }

.block { margin-top: 22px; }
.block-title { font-family: var(--hand); font-size: 26px; color: var(--ink); margin-bottom: 12px; line-height: 1; }
.psych-text { font-size: 14px; line-height: 1.78; color: var(--ink); text-wrap: pretty; }

.love-badges { display: flex; gap: 10px; margin-bottom: 12px; }
.love-badge { flex: 1; display: flex; align-items: center; gap: 10px; background: #fff; border: 1.5px solid rgba(0,0,0,0.06); border-radius: 14px; padding: 13px; box-shadow: 0 3px 10px -5px rgba(0,0,0,0.3); }
.lb-emoji { font-size: 26px; line-height: 1; }
.lb-meta { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.lb-kind { font-size: 11px; color: var(--sub); }
.lb-name { font-size: 15px; font-weight: 700; white-space: nowrap; }
.love-desc { font-size: 13.5px; line-height: 1.7; color: var(--sub); text-wrap: pretty; }

.compat { display: flex; flex-direction: column; gap: 12px; }
.compat-row { display: flex; align-items: center; gap: 11px; }
.compat-name { width: 98px; font-size: 13.5px; font-weight: 700; flex-shrink: 0; }
.compat-track { flex: 1; height: 11px; background: rgba(0,0,0,0.07); border: 1.5px solid rgba(0,0,0,0.07); border-radius: 100px; overflow: hidden; }
.compat-fill { height: 100%; background: var(--pink); border-radius: 100px; }
.compat-score { font-family: var(--hand); font-size: 22px; color: var(--pink-dk); width: 30px; text-align: right; flex-shrink: 0; line-height: 1; }

.advice-list { list-style: none; display: flex; flex-direction: column; gap: 11px; }
.advice-item { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.55; color: var(--ink); text-wrap: pretty; }
.pen-check { color: var(--pink); font-family: var(--hand); font-size: 26px; line-height: 0.8; flex-shrink: 0; }

.match-card { display: flex; align-items: center; gap: 13px; background: #fff; border: 1.5px solid rgba(0,0,0,0.06); border-radius: 16px; padding: 15px; box-shadow: 0 4px 14px -6px rgba(0,0,0,0.35); }
@media (prefers-reduced-motion: no-preference) { .match-block { animation: noteIn 0.4s ease; } }
.match-emoji { font-size: 40px; line-height: 1; }
.match-meta { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.match-name { font-family: var(--hand); font-size: 30px; color: var(--ink); line-height: 0.95; }
.match-line { font-size: 12px; color: var(--sub); line-height: 1.45; }
.match-score { font-family: var(--hand); font-size: 40px; color: var(--pink); line-height: 0.8; }
.match-score small { font-size: 18px; }

.actions { margin-top: 26px; display: flex; flex-direction: column; gap: 10px; }
.actions-row { display: flex; gap: 10px; }
.actions-row .s-btn { flex: 1; }

@media (max-width: 360px) {
  .s-intro .s-title { font-size: 50px; }
  .hero-name { font-size: 54px; }
  .compat-name { width: 86px; font-size: 12.5px; }
}
</style>

window.getCompat = function(a, b) {
  if (a === b) return 100;
  return window.COMPAT[a + "|" + b] ?? window.COMPAT[b + "|" + a] ?? 50;

  <script type="text/babel">
const { useState, useEffect, useRef } = React;
const STORE_KEY = "vibe_sticker_v1";

function computeResult(answers) {
  const vibe = {}, love = {};
  window.VIBE_ORDER.forEach((k) => (vibe[k] = 0));
  window.LOVE_ORDER.forEach((k) => (love[k] = 0));
  window.QUESTIONS.forEach((q, i) => {
    const v = answers[i];
    if (!v) return;
    const bucket = q.part === "vibe" ? vibe : love;
    q.targets.forEach((t) => (bucket[t] += v));
  });
  const topVibe = window.VIBE_ORDER.reduce((a, b) => (vibe[b] > vibe[a] ? b : a));
  const topLove = window.LOVE_ORDER.reduce((a, b) => (love[b] > love[a] ? b : a));
  return { vibe, love, topVibe, topLove };
}

function Intro({ onStart, hasSaved, onResume }) {
  const today = new Date();
  const dateStr = `${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')} · 오늘의 나`;
  return (
    <div className="s-screen s-intro">
      <div className="intro-stack" style={{ textAlign: "center" }}>
        <span className="s-date">{dateStr}</span>
        <h1 className="s-title">
          <span className="tl">나의 감성 &amp;</span>
          <span className="tl"><b>연애 성향</b> 테스트</span>
        </h1>
        <p className="s-sub">서른 개의 질문으로 적어보는<br />나의 바이브와 사랑의 방식</p>

        <div className="note s-meta">
          <div><div className="m-num">30</div><div className="m-label">문항</div></div>
          <div><div className="m-num">6+4</div><div className="m-label">유형</div></div>
          <div><div className="m-num">3분</div><div className="m-label">소요</div></div>
        </div>

        <div className="s-chips">
          <span className="chip">🌙 감성·바이브 20문항</span>
          <span className="chip">❤️ 연애 성향 10문항</span>
        </div>

        <button className="s-btn" onClick={onStart}>테스트 시작하기</button>
        {hasSaved && (
          <button className="s-btn ghost" style={{ marginTop: 10 }} onClick={onResume}>
            이어서 하기
          </button>
        )}
        <p className="s-foot">솔직하게 적을수록 정확해져요 ✎</p>
      </div>
    </div>
  );
}

function Scale({ value, onPick }) {
  const sizes = [50, 41, 33, 41, 50];
  return (
    <div>
      <div className="ticks">
        {window.SCALE.map((s, i) => (
          <button
            key={s.value}
            className={"tick" + (value === s.value ? " sel" : "")}
            style={{ width: sizes[i], height: sizes[i] }}
            onClick={() => onPick(s.value)}
            aria-label={s.label}
          />
        ))}
      </div>
      <div className="ends">
        <span>전혀 아니다</span>
        <span>매우 그렇다</span>
      </div>
    </div>
  );
}

function Quiz({ index, answers, onPick, onBack }) {
  const q = window.QUESTIONS[index];
  const num = index + 1;
  const isVibe = q.part === "vibe";
  return (
    <div className="s-screen s-quiz">
      <div className="topbar">
        <button className="back" onClick={onBack} disabled={index === 0}>‹</button>
        <div className="dots">
          {window.QUESTIONS.map((_, i) => (
            <div key={i} className={"d" + (i < num ? " on" : "")} />
          ))}
        </div>
        <span className="counter">{num}<span className="tot"> /30</span></span>
      </div>

      <div className="quiz-body">
        <div>
          <span className={"chip " + (isVibe ? "sage" : "pink")}>
            {isVibe ? "🌙 감성·바이브" : "❤️ 연애 성향"}
          </span>
        </div>
        <div className="note q-note" key={q.id}>
          <span className="q-index">Q{num}.</span>
          <p className="q-text">{q.text}</p>
        </div>
        <Scale value={answers[index]} onPick={(v) => onPick(index, v)} />
      </div>
    </div>
  );
}

function CompatChart({ topVibe }) {
  const rows = window.VIBE_ORDER
    .filter((k) => k !== topVibe)
    .map((k) => ({ k, t: window.VIBE_TYPES[k], score: window.getCompat(topVibe, k) }))
    .sort((a, b) => b.score - a.score);
  return (
    <div className="compat">
      {rows.map((r) => (
        <div className="compat-row" key={r.k}>
          <span className="compat-name">{r.t.emoji} {r.t.name}</span>
          <div className="compat-track">
            <div className="compat-fill" style={{ width: r.score + "%" }} />
          </div>
          <span className="compat-score">{r.score}</span>
        </div>
      ))}
    </div>
  );
}

function Result({ result, onRestart }) {
  const vibe = window.VIBE_TYPES[result.topVibe];
  const love = window.LOVE_TYPES[result.topLove];
  const [showMatch, setShowMatch] = useState(false);
  const [copied, setCopied] = useState(false);

  const bestMatchKey = window.VIBE_ORDER
    .filter((k) => k !== result.topVibe)
    .reduce((a, b) => (window.getCompat(result.topVibe, b) > window.getCompat(result.topVibe, a) ? b : a));
  const bestMatch = window.VIBE_TYPES[bestMatchKey];

  function copyResult() {
    const text = `${vibe.emoji} ${vibe.name}\n${vibe.oneLiner}\n\n연애 성향: ${love.emoji} ${love.name} · ${love.contact}\n나랑 잘 맞는 사람: ${bestMatch.emoji} ${bestMatch.name}\n\n나의 VIBE × 연애 성향 테스트 결과`;
    navigator.clipboard?.writeText(text).then(
      () => { setCopied(true); setTimeout(() => setCopied(false), 1800); },
      () => {}
    );
  }

  return (
    <div className="s-screen s-result">
      <div className="r-hero">
        <div className="stamp">VIBE<br />TYPE</div>
        <div className="hero-emoji">{vibe.emoji}</div>
        <span className="hero-kicker">나의 감성 유형은</span>
        <h1 className="hero-name">{vibe.name}</h1>
        <p className="hero-line">{vibe.oneLiner}</p>
        <span className="chip sm">{vibe.big5}</span>
      </div>

      <section className="block">
        <h2 className="block-title">🧠 심리학적으로 말하면</h2>
        <div className="note"><p className="psych-text">{vibe.psych}</p></div>
      </section>

      <section className="block">
        <h2 className="block-title">💘 나의 연애 성향</h2>
        <div className="love-badges">
          <div className="love-badge">
            <span className="lb-emoji">{love.emoji}</span>
            <div className="lb-meta">
              <span className="lb-kind">애착유형</span>
              <span className="lb-name">{love.name}</span>
            </div>
          </div>
          <div className="love-badge">
            <span className="lb-emoji">✉️</span>
            <div className="lb-meta">
              <span className="lb-kind">연락 스타일</span>
              <span className="lb-name">{love.contact}</span>
            </div>
          </div>
        </div>
        <p className="love-desc">{love.desc}</p>
      </section>

      <section className="block">
        <h2 className="block-title">🔗 유형별 궁합</h2>
        <CompatChart topVibe={result.topVibe} />
      </section>

      <section className="block">
        <h2 className="block-title">💌 나에게 한마디</h2>
        <ul className="advice-list">
          {vibe.advice.map((a, i) => (
            <li key={i} className="advice-item">
              <span className="pen-check">✓</span>{a}
            </li>
          ))}
        </ul>
      </section>

      {showMatch && (
        <section className="block match-block">
          <h2 className="block-title">✦ 나랑 가장 잘 맞는 사람</h2>
          <div className="match-card">
            <span className="match-emoji">{bestMatch.emoji}</span>
            <div className="match-meta">
              <span className="match-name">{bestMatch.name}</span>
              <span className="match-line">{bestMatch.oneLiner}</span>
            </div>
            <span className="match-score">
              {window.getCompat(result.topVibe, bestMatchKey)}<small>%</small>
            </span>
          </div>
        </section>
      )}

      <div className="actions">
        {!showMatch ? (
          <button className="s-btn" onClick={() => setShowMatch(true)}>
            나랑 맞는 사람 찾기
          </button>
        ) : (
          <a className="s-btn" href="https://vibe-56a26.web.app" target="_blank"
             style={{ textDecoration: "none", textAlign: "center", display: "block" }}>
            👉 바이브 앱에서 직접 찾기
          </a>
        )}
        <div className="actions-row">
          <button className="s-btn ghost" onClick={onRestart}>다시하기</button>
          <button className="s-btn ghost" onClick={copyResult}>{copied ? "복사됨 ✓" : "결과 복사"}</button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [stage, setStage] = useState("intro");
  const [index, setIndex] = useState(0);
  const [answers, setAnswers] = useState(Array(30).fill(null));
  const [result, setResult] = useState(null);
  const [hasSaved, setHasSaved] = useState(false);
  const timer = useRef(null);

  useEffect(() => {
    try {
      const s = JSON.parse(localStorage.getItem(STORE_KEY));
      if (s && Array.isArray(s.answers) && s.answers.some((a) => a != null)) setHasSaved(true);
    } catch (e) {}
  }, []);

  function persist(a, i) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ answers: a, index: i })); } catch (e) {}
  }
  function start() {
    setAnswers(Array(30).fill(null)); setIndex(0); setStage("quiz");
    localStorage.removeItem(STORE_KEY);
  }
  function resume() {
    try {
      const s = JSON.parse(localStorage.getItem(STORE_KEY));
      const a = s.answers || Array(30).fill(null);
      setAnswers(a);
      const fu = a.findIndex((x) => x == null);
      setIndex(fu === -1 ? 29 : fu);
      setStage("quiz");
    } catch (e) { start(); }
  }
  function pick(i, v) {
    const next = answers.slice(); next[i] = v;
    setAnswers(next); persist(next, i);
    clearTimeout(timer.current);
    timer.current = setTimeout(() => {
      if (i < 29) {
        setIndex(i + 1);
      } else {
        const res = computeResult(next);
        setResult(res);
        if (window.saveVibeType) window.saveVibeType(res.topVibe);
        setStage("result");
        localStorage.removeItem(STORE_KEY);
        window.scrollTo(0, 0);
      }
    }, 260);
  }
  function back() { if (index > 0) setIndex(index - 1); }
  function restart() {
    clearTimeout(timer.current);
    setResult(null); setHasSaved(false); setStage("intro");
    setAnswers(Array(30).fill(null)); setIndex(0);
    localStorage.removeItem(STORE_KEY); window.scrollTo(0, 0);
  }

  return (
    <div className="s-app">
      {stage === "intro" && <Intro onStart={start} hasSaved={hasSaved} onResume={resume} />}
      {stage === "quiz" && <Quiz index={index} answers={answers} onPick={pick} onBack={back} />}
      {stage === "result" && result && <Result result={result} onRestart={restart} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
